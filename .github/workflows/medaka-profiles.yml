name: Enrich medaka appearance profiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medaka-profiles.yml'
      - 'tools/enrich_descriptions.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Build factual variety profiles
        run: python tools/enrich_descriptions.py
      - name: Publish profiles
        run: |
          if git diff --quiet -- catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m 'Add original factual summaries based on source overview'
          git pull --rebase
          git push
