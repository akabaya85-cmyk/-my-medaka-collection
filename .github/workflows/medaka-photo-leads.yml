name: Find open-license medaka photo leads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medaka-photo-leads.yml'
      - 'tools/find_open_photo_leads.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Query Openverse conservatively
        run: python tools/find_open_photo_leads.py
      - name: Commit photo leads for review (not part of published catalog)
        run: |
          if ! test -f photo_candidates.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photo_candidates.json
          git diff --cached --quiet && exit 0
          git commit -m 'Stage unverified licensed medaka photo candidates'
          git pull --rebase
          git push
