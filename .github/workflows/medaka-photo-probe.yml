name: Inspect source medaka photos privately
on:
  push:
    branches: [main]
    paths:
      - 'tools/inspect_medaka_photos.py'
      - '.github/workflows/medaka-photo-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/inspect_medaka_photos.py
