<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f8ff"><link rel="manifest" href="manifest.webmanifest"><title>My Medaka Collection</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f3fbff;color:#183b4b}header{background:linear-gradient(120deg,#d7f4ff,#fff);padding:28px 18px 16px}h1{margin:3px 0;font-size:25px}small,.muted{color:#638494}.wrap{max-width:850px;margin:auto}main{padding:15px}input,select,button{font:inherit;border:1px solid #c6e2ed;border-radius:12px;padding:10px;background:white}input{box-sizing:border-box;width:100%}button{cursor:pointer}button.active{background:#c7edfc;border-color:#5bb8df}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}article{background:white;border:1px solid #deedf4;border-radius:16px;overflow:hidden}article img,.placeholder{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e0f3fa;display:flex;align-items:center;justify-content:center;color:#78a6b9;font-size:40px}article .body{padding:10px}article strong{display:block;min-height:42px;font-size:14px}article .buttons{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}article button{padding:6px;font-size:12px}dialog{border:0;border-radius:18px;max-width:480px;width:90%;max-height:85vh;overflow:auto;box-sizing:border-box}dialog::backdrop{background:#1238}dialog label{display:block;margin:12px 0 5px}dialog button{margin:4px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note{background:#fff;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}a{color:#167ea7}</style></head><body><div class="wrap"><header><small>PERSONAL MEDAKA ENCYCLOPEDIA</small><h1>🐟 My Medaka Collection</h1><div class="muted" id="stats">図鑑を準備中</div></header><main><input id="search" placeholder="品種名・特徴で検索"><div class="tabs" id="tabs"></div><div class="tools"><button id="add">＋ 品種を追加</button><button id="export">バックアップ保存</button><button id="import">バックアップ復元</button><button id="csv">CSV品種リスト取込</button><input type="file" id="file" hidden accept=".json,.csv,text/csv,application/json"></div><div class="note">写真は自分用に選択して端末内のブラウザに保存します。公開サーバーへ送信しません。ブラウザデータの消去で失われるため、写真を含むバックアップを定期的に保存してください。品種データは初期サンプルです。</div><div class="grid" id="grid"></div></main></div><dialog id="dialog"><div id="details"></div><button onclick="document.querySelector('dialog').close()">閉じる</button></dialog><script>
const seed=[['楊貴妃','朱赤'],['幹之','体外光'],['オロチ','ブラック'],['夜桜','ラメ'],['深海','青・腹膜青'],['黄金ラメ','黄金・ラメ'],['三色ラメ','三色・ラメ'],['紅白ラメ','紅白・ラメ'],['白メダカ','白'],['青メダカ','青'],['黒メダカ','黒'],['琥珀','琥珀'],['白幹之','白・体外光'],['マリンブルー','青'],['流星','体外光'],['サファイア','青・ラメ'],['星河','ラメ'],['三色','三色'],['紅白','紅白'],['ブラック','黒'],['ヒレ長','ヒレ変化'],['ダルマ','体型'],['オーロラ','半透明鱗'],['ピンク','ピンク'],['ピュアホワイト','白'],['初恋','流通名・要照合'],['ネプチューン','流通名・要照合'],['プラチナム','流通名・要照合'],['鱗光ヒカリ','黄青・鱗光'],['王華','白朱赤・ラメ'],['アマテラス','白朱赤・体外光'],['ワカサギ','青・体外光'],['プラチナマリンブルー','青・体外光'],['琴姫リアルロングフィン','琥珀・透明鱗'],['レーヴサムライヒカリ','青・ヒレ変化'],['紅薊リアルロングフィン','朱赤・ブラックリム'],['黄金スーパーヒカリ','黄金・ヒカリ'],['ブルーアイ','目の変化'],['ジャパンブルー','黒・体外光'],['アクアマリン','白・ルビーアイ']];
const K='my-medaka-v1';let entries;try{entries=JSON.parse(localStorage.getItem(K))||[]}catch{entries=[]}if(!entries.length)entries=seed.map(([name,traits],i)=>({id:'seed-'+i,name,traits,status:'none',wish:false,note:'',url:'https://medakazukan.net/varietyofmedaka/',photo:''}));let tab='all';const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(K,JSON.stringify(entries));return true}catch(e){alert('保存容量が不足しました。写真を減らすかバックアップを保存してください。');return false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let counts={current:0,past:0,wish:0};entries.forEach(x=>{if(x.status==='current'||x.status==='past')counts[x.status]++;if(x.wish)counts.wish++});$('stats').textContent=`収録 ${entries.length}件 ｜ 現在飼育中 ${counts.current} ｜ 過去に飼育 ${counts.past} ｜ 飼いたい ${counts.wish}`;let tabs=[['all','全図鑑'],['current','現在飼育中'],['past','過去に飼育'],['owned','飼育経験あり'],['wish','飼いたい']];$('tabs').innerHTML=tabs.map(([v,t])=>`<button class="${tab===v?'active':''}" data-tab="${v}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let q=$('search').value.trim().toLowerCase();let items=entries.filter(x=>(x.name+' '+x.traits).toLowerCase().includes(q)&&(tab==='all'||(tab==='owned'?['current','past'].includes(x.status):tab==='wish'?x.wish:x.status===tab)));$('grid').innerHTML=items.map(x=>`<article><div class="${x.photo?'':'placeholder'}">${x.photo?`<img src="${x.photo}" alt="">`:'🐟'}</div><div class="body"><strong>${esc(x.name)}</strong><small>${esc(x.traits||'')}</small><div class="buttons"><button data-open="${esc(x.id)}">詳細・写真</button><button data-cycle="${esc(x.id)}">${x.status==='current'?'飼育中 ✓':x.status==='past'?'飼育済 ✓':'未飼育'}</button><button data-wish="${esc(x.id)}">${x.wish?'♥ 飼いたい':'♡ 欲しい'}</button></div></div></article>`).join('')||'<p>該当する品種はありません。</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open));document.querySelectorAll('[data-cycle]').forEach(b=>b.onclick=()=>{let x=entries.find(z=>z.id===b.dataset.cycle);x.status=({none:'current',current:'past',past:'none'})[x.status]||'none';save();render()});document.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{let x=entries.find(z=>z.id===b.dataset.wish);x.wish=!x.wish;save();render()})}function detail(id){let x=entries.find(z=>z.id===id);if(!x)return;$('details').innerHTML=`<h2>${esc(x.name)}</h2><p>${esc(x.traits||'')}</p><label>品種名</label><input id="dn" value="${esc(x.name)}"><label>特徴・系統</label><input id="dt" value="${esc(x.traits||'')}"><label>図鑑出典URL</label><input id="du" value="${esc(x.url||'')}"><label>飼育状況</label><select id="ds"><option value="none">未飼育</option><option value="current">現在飼育中</option><option value="past">過去に飼育</option></select><label><input style="width:auto" type="checkbox" id="dw"> 今後飼いたい</label><label>個人用の参考写真（スクショ）</label><input id="dp" type="file" accept="image/*"><label>メモ</label><textarea id="dm" style="width:100%;min-height:70px">${esc(x.note||'')}</textarea><p><a href="${esc(x.url||'https://medakazukan.net/varietyofmedaka/')}" target="_blank" rel="noopener">出典・図鑑を開く ↗</a></p><button id="saveDetail">保存</button><button id="removePhoto">写真を外す</button>`;$('ds').value=x.status;$('dw').checked=x.wish;$('saveDetail').onclick=async()=>{x.name=$('dn').value.trim()||x.name;x.traits=$('dt').value;x.url=$('du').value;x.status=$('ds').value;x.wish=$('dw').checked;x.note=$('dm').value;let f=$('dp').files[0];if(f){if(f.size>5e6){alert('画像は5MB以下にしてください');return}x.photo=await new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}if(save()){$('dialog').close();render()}};$('removePhoto').onclick=()=>{x.photo='';save();detail(id);render()};$('dialog').showModal()}
$('search').oninput=render;$('add').onclick=()=>{let n=prompt('追加する品種名');if(!n||!n.trim())return;let x={id:'custom-'+Date.now(),name:n.trim(),traits:'',status:'none',wish:false,note:'',url:'https://medakazukan.net/varietyofmedaka/',photo:''};entries.unshift(x);save();render();detail(x.id)};function download(name,content,type){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>download('my-medaka-backup.json',JSON.stringify({version:1,entries},null,2),'application/json');let importMode='json';$('import').onclick=()=>{importMode='json';$('file').accept='.json,application/json';$('file').click()};$('csv').onclick=()=>{importMode='csv';$('file').accept='.csv,text/csv';$('file').click()};$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let raw=await f.text();if(importMode==='json'){let data=JSON.parse(raw);if(!Array.isArray(data.entries))throw Error('形式が違います');if(!confirm('現在の図鑑をバックアップの内容で置き換えますか？'))return;entries=data.entries.map((x,i)=>({...x,id:x.id||'restored-'+i,status:x.status||'none',wish:!!x.wish}));}else{let lines=raw.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);let added=0;for(let i=1;i<lines.length;i++){let [name,traits,url]=lines[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));if(name&&!entries.some(x=>x.name===name)){entries.push({id:'csv-'+Date.now()+'-'+i,name,traits:traits||'',url:url||'',status:'none',wish:false,note:'',photo:''});added++}}alert(added+'件を追加しました。CSV列順：name,traits,url（カンマを含むセルには未対応）')}save();render()}catch(err){alert('読み込みできませんでした：'+err.message)}finally{e.target.value=''}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
